version: "3.9"

services:
  bot:
    build: .
    image: newstrategybot:latest
    container_name: newstrategybot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist DB and logs on the host so they survive container rebuilds.
      - ./data:/home/botuser/app/data
      - ./logs:/home/botuser/app/logs
    # No exposed ports — the bot only makes outbound connections to
    # Telegram and Binance.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostbyname('api.binance.com')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
